<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pixel Verse SMP</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-image: url("file_00000000e3d482108be29f77ad483d21.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        .server-button {
            padding: 18px 40px;
            font-size: 22px;
            font-weight: bold;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid white;
            border-radius: 12px;
            cursor: pointer;
        }

        .server-info {
            display: none;
            margin-top: 20px;
            padding: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 12px;
            font-size: 20px;
        }

        .server-info div {
            margin: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <button class="server-button" onclick="showServer()">
        ورود به سرور
    </button>

    <div class="server-info" id="serverInfo">
        <div>IP: 81.12.50.28</div>
        <div>Port: 19132</div>
    </div>

</div>

<script>
function showServer() {
    document.getElementById("serverInfo").style.display = "block";
}
</script>

</body>
</html>
