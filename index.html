<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Verse</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background-image: url("file_000000008e7481f4b58fb06dc63ac6ae.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            font-family: Arial, sans-serif;
        }

        .menu {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .menu-button {
            width: 50px;
            height: 45px;

            background: rgba(0, 0, 0, 0.85);
            border: 2px solid white;
            border-radius: 10px;

            color: white;
            font-size: 27px;
            cursor: pointer;
        }

        .menu-content {
            display: none;

            position: absolute;
            right: 0;
            top: 55px;

            width: 180px;

            background: rgba(0, 0, 0, 0.95);
            border: 1px solid white;
            border-radius: 10px;

            overflow: hidden;
        }

        .menu:hover .menu-content {
            display: block;
        }

        .menu-content a {
            display: block;
            padding: 15px;

            color: white;
            text-decoration: none;
            text-align: center;

            font-size: 17px;
        }

        .menu-content a:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .center {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .welcome {
            padding: 25px;

            color: white;

            background: rgba(0, 0, 0, 0.45);
            border-radius: 18px;

            backdrop-filter: blur(4px);
        }

        .welcome h1 {
            margin: 0 0 10px;
            font-size: 35px;
        }

        .welcome p {
            margin: 0;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="menu">

    <button class="menu-button">
        ☰
    </button>

    <div class="menu-content">

        <a href="index.html">
            🏠 صفحه اصلی
        </a>

        <a href="chat.html">
            💬 چت
        </a>

        <a href="login.html">
            👤 ورود / ثبت‌نام
        </a>

    </div>

</div>

<div class="center">

    <div class="welcome">

        <h1>Pixel Verse</h1>

        <p>
            به پیام‌رسان Pixel Verse خوش آمدید
        </p>

    </div>

</div>

</body>
</html>
