<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Verse SMP</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            background-image: url("file_00000000e3d482108be29f77ad483d21.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
        }

        /* منوی سه خط */
        .menu {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .menu-button {
            width: 50px;
            height: 45px;

            background: rgba(0, 0, 0, 0.85);
            border: 2px solid white;
            border-radius: 10px;

            color: white;
            font-size: 27px;
            cursor: pointer;
        }

        .menu-content {
            display: none;

            position: absolute;
            right: 0;
            top: 55px;

            width: 170px;

            background: rgba(0, 0, 0, 0.95);
            border: 1px solid white;
            border-radius: 10px;

            overflow: hidden;
        }

        .menu-content a {
            display: block;

            padding: 15px;

            color: white;
            text-decoration: none;
            text-align: center;

            font-size: 17px;
        }

        .menu-content a:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .menu:hover .menu-content {
            display: block;
        }

        .container {
            text-align: center;
        }

        .server-button {
            padding: 18px 40px;

            font-size: 22px;
            font-weight: bold;

            color: white;

            background: rgba(0, 0, 0, 0.8);

            border: 2px solid white;
            border-radius: 12px;

            cursor: pointer;
        }

        .server-info {
            display: none;

            margin-top: 20px;
            padding: 20px;

            color: white;

            background: rgba(0, 0, 0, 0.85);

            border-radius: 12px;

            font-size: 20px;
        }

        .server-info div {
            margin: 8px;
        }

        .online {
            color: #00ff66;
            font-weight: bold;
        }

        .offline {
            color: #ff3333;
            font-weight: bold;
        }
    </style>
</head>

<body>

<!-- منوی سه خط -->
<div class="menu">

    <button class="menu-button">
        ☰
    </button>

    <div class="menu-content">

        <a href="index.html">
            🏠 صفحه اصلی
        </a>

        <a href="products.html">
            🛒 محصولات
        </a>

        <a href="chat.html">
            💬 چت
        </a>

    </div>

</div>


<div class="container">

    <button class="server-button" onclick="showServer()">
        ورود به سرور
    </button>

    <div class="server-info" id="serverInfo">

        <div>
            IP: 81.12.50.28
        </div>

        <div>
            Port: 19132
        </div>

        <div id="status">
            در حال بررسی...
        </div>

        <div id="players"></div>
