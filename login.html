<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود / ثبت‌نام - Pixel Verse</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-image: url("file_000000008e7481f4b58fb06dc63ac6ae.png");
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 90%;
            max-width: 380px;
            padding: 25px;
            background: rgba(0,0,0,0.85);
            border-radius: 18px;
            text-align: center;
            color: white;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #2196f3;
            color: white;
            font-size: 17px;
        }

        #message {
            margin-top: 15px;
        }

        a {
            display: block;
            margin-top: 20px;
            color: white;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Pixel Verse</h1>

    <input type="text" id="username" placeholder="نام کاربری">

    <input type="password" id="password" placeholder="رمز عبور">

    <button onclick="register()">ثبت‌نام</button>

    <button onclick="login()">ورود</button>

    <div id="message"></div>

    <a href="index.html">بازگشت به صفحه اصلی</a>

</div>

<script>

const SUPABASE_URL =
"https://ziigiepvuqjethzanjka.supabase.co";

const SUPABASE_KEY =
"sb_publishable_To2GG-pdTwB77nIfe5b20Q_ncT8eAOb";


function makeEmail(username) {
    return username.toLowerCase().replace(/[^a-z0-9]/g, "")
        + "@pixelverse.local";
}


async function register() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    if (!username || !password) {
        message.innerText =
            "نام کاربری و رمز عبور را وارد کنید.";
        return;
    }

    if (password.length < 6) {
        message.innerText =
            "رمز عبور باید حداقل ۶ کاراکتر باشد.";
        return;
    }

    const email = makeEmail(username);

    try {

        const response = await fetch(
            SUPABASE_URL + "/auth/v1/signup",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            message.innerText =
                data.msg ||
                data.error_description ||
                "ثبت‌نام انجام نشد.";
            return;
        }

        message.innerText =
            "ثبت‌نام با موفقیت انجام شد.";

        await saveProfile(username, data.user);

    } catch (error) {

        message.innerText =
            "خطا در اتصال به Supabase.";

    }
}


async function saveProfile(username, user) {

    if (!user) return;

    await fetch(
        SUPABASE_URL + "/rest/v1/profiles",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY
            },
            body: JSON.stringify({
                id: user.id,
                username: username
            })
        }
    );
}


async function login() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    if (!username || !password) {
        message.innerText =
            "نام کاربری و رمز عبور را وارد کنید.";
        return;
    }

    const email = makeEmail(username);

    try {

        const response = await fetch(
            SUPABASE_URL + "/auth/v1/token?grant_type=password",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            message.innerText =
                data.msg ||
                data.error_description ||
                "نام کاربری یا رمز عبور اشتباه است.";
            return;
        }

        localStorage.setItem(
            "access_token",
            data.access_token
        );

        localStorage.setItem(
            "username",
            username
        );

        window.location.href = "chat.html";

    } catch (error) {

        message.innerText =
            "خطا در اتصال به Supabase.";

    }
}

</script>

</body>
</html>
