<!DOCTYPE html><html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود / ثبت‌نام - Pixel Verse</title><style>
    body {
        margin: 0;
        min-height: 100vh;
        background-image: url("file_000000008e7481f4b58fb06dc63ac6ae.png");
        background-size: cover;
        background-position: center;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .box {
        width: 90%;
        max-width: 380px;
        padding: 25px;
        background: rgba(0,0,0,0.85);
        border-radius: 18px;
        text-align: center;
        color: white;
        box-sizing: border-box;
    }

    h1 {
        margin-top: 0;
    }

    input {
        width: 100%;
        padding: 14px;
        margin: 8px 0;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        box-sizing: border-box;
    }

    button {
        width: 100%;
        padding: 14px;
        margin-top: 10px;
        border: none;
        border-radius: 8px;
        background: #2196f3;
        color: white;
        font-size: 17px;
        cursor: pointer;
    }

    #message {
        margin-top: 15px;
    }

    a {
        display: block;
        margin-top: 20px;
        color: white;
        text-decoration: none;
    }
</style>

</head><body><div class="box"><h1>Pixel Verse</h1>

<input type="text" id="username" placeholder="نام کاربری">

<input type="password" id="password" placeholder="رمز عبور">

<button onclick="register()">ثبت‌نام</button>

<button onclick="login()">ورود</button>

<div id="message"></div>

<a href="index.html">بازگشت به صفحه اصلی</a>

</div><script>

const SUPABASE_URL =
"https://ziigiepvuqjethzanjka.supabase.co";

const SUPABASE_KEY =
"sb_publishable_To2GG-pdTwB77Nife5b20Q_ncT8eAOb";


async function register() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    if (!username || !password) {
        message.innerText =
            "نام کاربری و رمز عبور را وارد کنید.";
        return;
    }

    if (password.length < 4) {
        message.innerText =
            "رمز عبور باید حداقل ۴ کاراکتر باشد.";
        return;
    }

    try {

        // بررسی می‌کند این نام کاربری قبلاً وجود دارد یا نه
        const checkResponse = await fetch(
            SUPABASE_URL +
            "/rest/v1/profiles?username=eq." +
            encodeURIComponent(username) +
            "&select=username",
            {
                method: "GET",
                headers: {
                    "apikey": SUPABASE_KEY
                }
            }
        );

        const existingUsers =
            await checkResponse.json();

        if (existingUsers.length > 0) {
            message.innerText =
                "این نام کاربری قبلاً ثبت شده است.";
            return;
        }

        // ساخت حساب جدید
        const response = await fetch(
            SUPABASE_URL + "/rest/v1/profiles",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY,
                    "Prefer": "return=minimal"
                },
                body: JSON.stringify({
                    id: crypto.randomUUID(),
                    username: username,
                    password: password
                })
            }
        );

        if (!response.ok) {

            const errorText =
                await response.text();

            message.innerText =
                "ثبت‌نام انجام نشد: " + errorText;

            return;
        }

        localStorage.setItem(
            "username",
            username
        );

        message.innerText =
            "ثبت‌نام با موفقیت انجام شد.";

        setTimeout(function() {
            window.location.href = "chat.html";
        }, 1000);

    } catch (error) {

        message.innerText =
            "خطا در اتصال به Supabase.";

    }
}


async function login() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    if (!username || !password) {
        message.innerText =
            "نام کاربری و رمز عبور را وارد کنید.";
        return;
    }

    try {

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/profiles?username=eq." +
            encodeURIComponent(username) +
            "&password=eq." +
            encodeURIComponent(password) +
            "&select=username",
            {
                method: "GET",
                headers: {
                    "apikey": SUPABASE_KEY
                }
            }
        );

        if (!response.ok) {

            message.innerText =
                "خطا در اتصال به حساب.";

            return;
        }

        const users =
            await response.json();

        if (users.length === 0) {

            message.innerText =
                "نام کاربری یا رمز عبور اشتباه است.";

            return;
        }

        localStorage.setItem(
            "username",
            username
        );

        message.innerText =
            "ورود موفق بود.";

        setTimeout(function() {
            window.location.href = "chat.html";
        }, 500);

    } catch (error) {

        message.innerText =
            "خطا در اتصال به Supabase.";

    }
}

</script></body>
</html>
