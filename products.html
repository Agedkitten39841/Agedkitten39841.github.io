<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>محصولات | Pixel Verse</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #080812;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        /* منوی سه خط */
        .menu {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .menu-button {
            width: 50px;
            height: 45px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid white;
            border-radius: 10px;
            color: white;
            font-size: 27px;
            cursor: pointer;
        }

        .menu-content {
            display: none;
            position: absolute;
            right: 0;
            top: 55px;
            width: 170px;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid white;
            border-radius: 10px;
            overflow: hidden;
        }

        .menu-content a {
            display: block;
            padding: 15px;
            color: white;
            text-decoration: none;
            text-align: center;
            font-size: 17px;
        }

        .menu-content a:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .menu:hover .menu-content {
            display: block;
        }

        /* عنوان */
        h1 {
            padding-top: 35px;
            font-size: 32px;
        }

        /* عکس محصولات */
        .product-image {
            width: 90%;
            max-width: 1200px;
            margin: 20px auto 40px;
            display: block;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(100, 100, 255, 0.4);
        }
    </style>
</head>

<body>

<!-- منوی سه خط -->
<div class="menu">
    <button class="menu-button">☰</button>

    <div class="menu-content">
        <a href="index.html">صفحه اصلی</a>
        <a href="products.html">محصولات</a>
    </div>
</div>

<h1>محصولات Pixel Verse</h1>

<img
    src="file_00000000685081f4b64604e2e13302c4.png"
    class="product-image"
    alt="محصولات Pixel Verse"
>

</body>
</html>
