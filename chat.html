<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pixel Verse Chat</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #111;
            color: white;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .back {
            position: fixed;
            top: 15px;
            left: 15px;

            padding: 10px 15px;

            background: #222;
            color: white;

            text-decoration: none;

            border: 1px solid white;
            border-radius: 8px;
        }

        .chat {
            width: 95%;
            max-width: 600px;
            height: 80vh;

            background: #181818;

            border: 2px solid #333;
            border-radius: 15px;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        .header {
            padding: 18px;

            text-align: center;

            background: #222;

            font-size: 22px;
            font-weight: bold;
        }

        #messages {
            flex: 1;

            padding: 15px;

            overflow-y: auto;
        }

        .message {
            background: #292929;

            padding: 10px;

            margin-bottom: 10px;

            border-radius: 10px;
        }

        .input-box {
            display: flex;

            gap: 8px;

            padding: 12px;

            background: #222;
        }

        #messageInput {
            flex: 1;

            padding: 13px;

            border: none;
            border-radius: 8px;

            background: #333;
            color: white;

            outline: none;
        }

        #sendButton {
            padding: 0 20px;

            border: none;
            border-radius: 8px;

            background: #4caf50;
            color: white;

            font-weight: bold;

            cursor: pointer;
        }

    </style>
</head>

<body>

<a href="index.html" class="back">
    ← برگشت
</a>


<div class="chat">

    <div class="header">
        💬 Pixel Verse Chat
    </div>


    <div id="messages">

    </div>


    <div class="input-box">

        <input
            id="messageInput"
            type="text"
            placeholder="پیامت را بنویس..."
        >

        <button id="sendButton">
            ارسال
        </button>

    </div>

</div>


<script>

const input =
document.getElementById("messageInput");

const button =
document.getElementById("sendButton");

const messages =
document.getElementById("messages");


button.addEventListener("click", sendMessage);


input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        sendMessage();

    }

});


function sendMessage() {

    const text =
    input.value.trim();


    if (text === "") {

        return;

    }


    const message =
    document.createElement("div");


    message.className =
    "message";


    message.textContent =
    text;


    messages.appendChild(message);


    input.value = "";


    messages.scrollTop =
    messages.scrollHeight;

}

</script>

</body>
</html>
