<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Verse Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 95%;
            max-width: 600px;
            height: 85vh;

            background: #181818;

            border: 2px solid #333;
            border-radius: 15px;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        .header {
            padding: 18px;

            text-align: center;

            background: #202020;

            border-bottom: 1px solid #333;

            font-size: 22px;
            font-weight: bold;
        }

        .messages {
            flex: 1;

            padding: 15px;

            overflow-y: auto;
        }

        .message {
            background: #252525;

            padding: 10px 13px;

            margin-bottom: 10px;

            border-radius: 10px;
        }

        .name {
            color: #4caf50;

            font-weight: bold;

            margin-bottom: 5px;
        }

        .time {
            color: #888;

            font-size: 11px;

            margin-top: 5px;
        }

        .input-area {
            display: flex;

            gap: 8px;

            padding: 12px;

            background: #202020;

            border-top: 1px solid #333;
        }

        input {
            flex: 1;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #292929;

            color: white;

            outline: none;

            font-size: 15px;
        }

        button {
            padding: 0 18px;

            border: none;

            border-radius: 8px;

            background: #4caf50;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #43a047;
        }

        .back {
            position: fixed;

            top: 15px;
            left: 15px;

            padding: 10px 15px;

            background: rgba(0, 0, 0, 0.8);

            color: white;

            text-decoration: none;

            border: 1px solid white;

            border-radius: 8px;
        }
    </style>
</head>

<body>

</a>
